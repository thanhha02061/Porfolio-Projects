# Chạy pipeline Retail Data Hub mỗi sáng và commit dữ liệu vừa làm mới.
name: Retail Data Hub - pipeline hằng ngày

on:
  schedule:
    - cron: "0 23 * * *"      # 06:00 giờ Việt Nam
  workflow_dispatch:           # nút "Run workflow" để chạy tay

permissions:
  contents: write

concurrency:
  group: retail-data-hub
  cancel-in-progress: false

env:
  HUB_DIR: "0. [Python] Retail Data Hub"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "${{ env.HUB_DIR }}/requirements.txt"

      - name: Cài thư viện
        run: pip install -r "$HUB_DIR/requirements.txt"

      - name: Extract, transform, kiểm tra chất lượng, publish
        id: run
        run: python "$HUB_DIR/pipeline/run.py"

      - name: Commit dữ liệu mới (kể cả khi thất bại, để giữ log chạy)
        if: always()
        run: |
          git config user.name  "retail-data-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$HUB_DIR/lake" "$HUB_DIR/state" "$HUB_DIR/output" "$HUB_DIR/README.md"
          git diff --cached --quiet || git commit -m "data-hub: lần chạy hằng ngày $(date -u +%F)"
          git push
