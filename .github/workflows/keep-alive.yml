# Giữ cho Supabase gói free không bị tạm dừng.
# Supabase pause project sau 7 ngày ít hoạt động — job này ping 3 ngày một lần.
name: keep supabase alive

on:
  schedule:
    - cron: '0 3 */3 * *'   # 10h sáng giờ VN, 3 ngày một lần
  workflow_dispatch:         # cho phép bấm chạy tay

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/file_nap_log?select=ten_file&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Ping thất bại — kiểm tra lại secrets hoặc project đã bị pause chưa"
            exit 1
          fi
