<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="600" rx="18" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Retail Data Hub: luồng dữ liệu tự động</text>
  <text x="30" y="66" font-size="14" fill="#64748b">5 hệ thống nguồn → 1 nguồn duy nhất, tự kiểm tra lỗi trước khi công bố</text>

  <!-- sources -->
  <rect x="24" y="86" width="252" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="150" y="112" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">HỆ THỐNG NGUỒN</text>
  <g font-size="13">
    <rect x="40" y="126" width="220" height="72" rx="10" fill="#eff6ff" stroke="#2563eb"/><rect x="40" y="126" width="8" height="72" rx="4" fill="#2563eb"/>
    <text x="60" y="154" font-weight="700" font-size="15" fill="#1e3a8a">POS cửa hàng</text><text x="60" y="178" fill="#475569">dd/mm/yyyy, mã nội bộ</text>
    <rect x="40" y="210" width="220" height="72" rx="10" fill="#fff7ed" stroke="#f97316"/><rect x="40" y="210" width="8" height="72" rx="4" fill="#f97316"/>
    <text x="60" y="238" font-weight="700" font-size="15" fill="#9a3412">Shopee</text><text x="60" y="262" fill="#475569">epoch UTC, dòng trùng</text>
    <rect x="40" y="294" width="220" height="72" rx="10" fill="#f1f5f9" stroke="#111827"/><rect x="40" y="294" width="8" height="72" rx="4" fill="#111827"/>
    <text x="60" y="322" font-weight="700" font-size="15" fill="#111827">TikTok Shop</text><text x="60" y="346" fill="#475569">ISO UTC, SKU lẫn hoa thường</text>
    <rect x="40" y="378" width="220" height="72" rx="10" fill="#ecfdf5" stroke="#10b981"/><rect x="40" y="378" width="8" height="72" rx="4" fill="#10b981"/>
    <text x="60" y="406" font-weight="700" font-size="15" fill="#065f46">Website</text><text x="60" y="430" fill="#475569">+07:00, barcode làm SKU</text>
    <rect x="40" y="462" width="220" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed"/><rect x="40" y="462" width="8" height="72" rx="4" fill="#7c3aed"/>
    <text x="60" y="490" font-weight="700" font-size="15" fill="#5b21b6">ERP</text><text x="60" y="514" fill="#475569">ảnh chụp tồn kho cuối ngày</text>
  </g>

  <!-- extract arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M260 162 C300 162 300 300 336 306"/><path d="M260 246 C300 246 300 306 336 310"/>
    <path d="M260 330 L336 316" marker-end="url(#a)"/><path d="M260 414 C300 414 300 326 336 322"/>
    <path d="M260 498 C300 498 300 330 336 326" marker-end="url(#a)"/>
  </g>
  <text x="408" y="204" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">① EXTRACT</text>
  <text x="408" y="222" font-size="12" fill="#64748b" text-anchor="middle">chỉ lấy ngày mới (watermark)</text>

  <!-- lake cylinder -->
  <path d="M346 256 v110 a62 16 0 0 0 124 0 v-110" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="408" cy="256" rx="62" ry="16" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="408" y="306" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Lake</text>
  <text x="408" y="328" font-size="12" fill="#334155" text-anchor="middle">dữ liệu thô</text>
  <text x="408" y="346" font-size="12" fill="#334155" text-anchor="middle">chia theo ngày</text>

  <path d="M472 316 L528 316" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- staging -->
  <rect x="532" y="250" width="200" height="132" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="632" y="280" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">② STAGING SQL</text>
  <text x="632" y="302" font-size="12" fill="#334155" text-anchor="middle">giờ VN · master SKU</text>
  <text x="632" y="320" font-size="12" fill="#334155" text-anchor="middle">một công thức doanh thu thuần</text>
  <rect x="556" y="334" width="152" height="34" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="632" y="356" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">fct_sales · fct_inventory</text>

  <!-- master data -->
  <rect x="552" y="440" width="160" height="62" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="632" y="466" font-size="13" font-weight="700" fill="#9d174d" text-anchor="middle">Master data</text>
  <text x="632" y="486" font-size="12" fill="#334155" text-anchor="middle">SKU + cửa hàng</text>
  <path d="M632 440 L632 388" stroke="#db2777" stroke-width="2" marker-end="url(#a)"/>

  <path d="M732 316 L786 316" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- quality diamond -->
  <path d="M870 226 L956 316 L870 406 L784 316 Z" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="870" y="298" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">③ KIỂM TRA</text>
  <text x="870" y="316" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">CHẤT LƯỢNG</text>
  <text x="870" y="336" font-size="12" fill="#334155" text-anchor="middle">9 phép · đạt hết?</text>

  <!-- pass / fail -->
  <path d="M913 271 C940 200 960 190 990 190" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <text x="944" y="214" font-size="13" font-weight="700" fill="#059669">đạt</text>
  <path d="M913 361 C940 432 960 442 990 442" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="900" y="470" font-size="13" font-weight="700" fill="#dc2626">không đạt</text>

  <rect x="994" y="130" width="182" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1085" y="160" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">④ PUBLISH</text>
  <text x="1085" y="184" font-size="12" fill="#334155" text-anchor="middle">Marts cho báo cáo</text>
  <text x="1085" y="204" font-size="12" fill="#334155" text-anchor="middle">JSON + biểu đồ</text>
  <text x="1085" y="224" font-size="12" fill="#334155" text-anchor="middle">cập nhật README</text>

  <rect x="994" y="390" width="182" height="104" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1085" y="420" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">DỪNG CÔNG BỐ</text>
  <text x="1085" y="444" font-size="12" fill="#334155" text-anchor="middle">giữ số đúng của hôm qua</text>
  <text x="1085" y="464" font-size="12" fill="#334155" text-anchor="middle">đánh dấu lần chạy lỗi</text>

  <!-- schedule band -->
  <rect x="330" y="524" width="846" height="40" rx="10" fill="#0f172a"/>
  <text x="753" y="549" font-size="14" fill="#ffffff" text-anchor="middle"><tspan font-weight="700">GitHub Actions</tspan> tự chạy toàn bộ luồng lúc 06:00 mỗi sáng và commit kết quả, không cần ai chạy tay</text>
</svg>
